name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export directory
        run: mkdir -p build

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/StarDodge-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarDodge-Android-APK
          path: build/StarDodge-debug.apk
          if-no-files-found: error
